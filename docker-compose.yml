name: stellarcrew-v2

services:
  postgres:
    image: postgres:17-alpine
    container_name: sc_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stellarcrew}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-stellarcrew}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - sc_net

  redis:
    image: redis:7-alpine
    container_name: sc_redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sc_net

  mailpit:
    image: axllent/mailpit:latest
    container_name: sc_mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025/"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sc_net

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: sc_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - sc_net

  backend:
    build:
      context: ./backend
      target: dev
    container_name: sc_backend
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-replace_me}
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@postgres:5432/stellarcrew?serverVersion=17&charset=utf8}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      MAILER_DSN: ${MAILER_DSN:-smtp://mailpit:1025}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - sc_net

  frontend:
    image: node:22-alpine
    container_name: sc_frontend
    working_dir: /app
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    command: sh -c "corepack enable && corepack prepare pnpm@9.12.3 --activate && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0 --port $${FRONTEND_PORT}"
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:${FRONTEND_PORT:-5173}/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s
    networks:
      - sc_net

networks:
  sc_net:
    name: sc_net
    driver: bridge

volumes:
  postgres_data:
    name: sc_postgres_data
  redis_data:
    name: sc_redis_data
  frontend_node_modules:
    name: sc_frontend_node_modules
