# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # registers every module class as a service (DDD + CQRS, bundle per module)
    Modules\:
        resource: '../modules/'

    # shared kernel bindings: clock + uuid generator defaults for all consumers
    Modules\Shared\Kernel\Clock:
        alias: Modules\Shared\Kernel\SystemClock

    Modules\Shared\Kernel\UuidGenerator:
        alias: Modules\Shared\Kernel\Uuid7Generator

    # Redis client built from REDIS_URL (DSN parsed by symfony/cache's Redis adapter)
    Redis:
        class: Redis
        factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
        arguments:
            $dsn: '%env(REDIS_URL)%'

    # Rabbit probe wired to the broker host+port (DSN not required: health check is a TCP ping)
    Modules\Core\Infrastructure\HealthCheck\TcpRabbitConnectionProbe:
        arguments:
            $host: '%env(RABBITMQ_HOST)%'
            $port: '%env(int:RABBITMQ_PORT)%'

    Modules\Core\Infrastructure\HealthCheck\RabbitConnectionProbe:
        alias: Modules\Core\Infrastructure\HealthCheck\TcpRabbitConnectionProbe

    # Core install bindings
    Modules\Core\Domain\SystemSettingRepository:
        alias: Modules\Core\Infrastructure\Doctrine\Repository\DoctrineSystemSettingRepository

    # Auth module bindings
    Modules\Auth\Domain\UserRepository:
        alias: Modules\Auth\Infrastructure\Doctrine\Repository\DoctrineUserRepository

    Modules\Auth\Application\PasswordHasher:
        alias: Modules\Auth\Infrastructure\Security\SymfonyPasswordHasher

    Modules\Auth\Api\AuthApi:
        alias: Modules\Auth\Infrastructure\DefaultAuthApi

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
