# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # registers every module class as a service (DDD + CQRS, bundle per module)
    Modules\:
        resource: '../modules/'

    # shared kernel bindings: clock + uuid generator defaults for all consumers
    Modules\Shared\Kernel\Clock:
        alias: Modules\Shared\Kernel\SystemClock

    Modules\Shared\Kernel\UuidGenerator:
        alias: Modules\Shared\Kernel\Uuid7Generator

    # Redis client built from REDIS_URL (DSN parsed by symfony/cache's Redis adapter)
    Redis:
        class: Redis
        factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
        arguments:
            $dsn: '%env(REDIS_URL)%'

    # Rabbit probe wired to the broker host+port (DSN not required: health check is a TCP ping)
    Modules\Core\Infrastructure\HealthCheck\TcpRabbitConnectionProbe:
        arguments:
            $host: '%env(RABBITMQ_HOST)%'
            $port: '%env(int:RABBITMQ_PORT)%'

    Modules\Core\Infrastructure\HealthCheck\RabbitConnectionProbe:
        alias: Modules\Core\Infrastructure\HealthCheck\TcpRabbitConnectionProbe

    # Core install bindings
    Modules\Core\Domain\SystemSettingRepository:
        alias: Modules\Core\Infrastructure\Doctrine\Repository\DoctrineSystemSettingRepository

    # Audit module bindings
    Modules\Audit\Domain\AuditLogEntryRepository:
        alias: Modules\Audit\Infrastructure\Doctrine\Repository\DoctrineAuditLogEntryRepository

    Modules\Audit\Application\ReadModel\AuditEntriesReadModel:
        alias: Modules\Audit\Infrastructure\ReadModel\DbalAuditEntriesReadModel

    Modules\Audit\Api\AuditApi:
        alias: Modules\Audit\Infrastructure\Service\AuditService

    # Concrete logger from the Audit module replaces the Core no-op sink
    Modules\Core\Api\AuditLoggerInterface:
        alias: Modules\Audit\Infrastructure\Service\AuditService

    # Auth module bindings
    Modules\Auth\Domain\UserRepository:
        alias: Modules\Auth\Infrastructure\Doctrine\Repository\DoctrineUserRepository

    Modules\Auth\Application\PasswordHasher:
        alias: Modules\Auth\Infrastructure\Security\SymfonyPasswordHasher

    Modules\Auth\Api\AuthApi:
        alias: Modules\Auth\Infrastructure\DefaultAuthApi

    # Workspaces module bindings
    Modules\Workspaces\Domain\WorkspaceRepository:
        alias: Modules\Workspaces\Infrastructure\Doctrine\Repository\DoctrineWorkspaceRepository

    Modules\Workspaces\Api\WorkspacesApi:
        alias: Modules\Workspaces\Infrastructure\Api\DefaultWorkspacesApi

    Modules\Workspaces\Application\ReadModel\WorkspaceMembersReadModel:
        alias: Modules\Workspaces\Infrastructure\ReadModel\DbalWorkspaceMembersReadModel

    # Projects module bindings
    Modules\Projects\Domain\ProjectRepository:
        alias: Modules\Projects\Infrastructure\Doctrine\Repository\DoctrineProjectRepository

    # Agents module bindings
    Modules\Agents\Domain\AgentRepository:
        alias: Modules\Agents\Infrastructure\Doctrine\Repository\DoctrineAgentRepository

    Modules\Agents\Domain\AgentMemberRepository:
        alias: Modules\Agents\Infrastructure\Doctrine\Repository\DoctrineAgentMemberRepository

    Modules\Agents\Domain\AgentTemplateRepository:
        alias: Modules\Agents\Infrastructure\Doctrine\Repository\DoctrineAgentTemplateRepository

    Modules\Agents\Api\AgentsApi:
        alias: Modules\Agents\Infrastructure\Api\DefaultAgentsApi

    # Chat module bindings
    Modules\Chat\Domain\ChatSessionRepository:
        alias: Modules\Chat\Infrastructure\Doctrine\Repository\DoctrineChatSessionRepository

    Modules\Chat\Domain\ChatThreadRepository:
        alias: Modules\Chat\Infrastructure\Doctrine\Repository\DoctrineChatThreadRepository

    Modules\Chat\Domain\ChatMessageRepository:
        alias: Modules\Chat\Infrastructure\Doctrine\Repository\DoctrineChatMessageRepository

    Modules\Chat\Domain\ChatThreadWorkerSessionRepository:
        alias: Modules\Chat\Infrastructure\Doctrine\Repository\DoctrineChatThreadWorkerSessionRepository

    # Workers module bindings (ADR-BE-007)
    Modules\Workers\Domain\WorkerRepository:
        alias: Modules\Workers\Infrastructure\Doctrine\Repository\DoctrineWorkerRepository

    Modules\Workers\Domain\WorkerPairingCodeRepository:
        alias: Modules\Workers\Infrastructure\Doctrine\Repository\DoctrineWorkerPairingCodeRepository

    Modules\Workers\Domain\WorkerRefreshTokenRepository:
        alias: Modules\Workers\Infrastructure\Doctrine\Repository\DoctrineWorkerRefreshTokenRepository

    Modules\Workers\Domain\WorkerAccessTokenEncoder:
        alias: Modules\Workers\Infrastructure\Support\LexikWorkerAccessTokenEncoder

    Modules\Workers\Domain\RefreshTokenGenerator:
        alias: Modules\Workers\Infrastructure\Support\RandomBytesRefreshTokenGenerator

    # Plan limits (cross-cutting usage gate per ADR-BE-006)
    Modules\Shared\Api\PlanLimitsService:
        alias: Modules\Shared\Infrastructure\Plans\ConfigBackedPlanLimitsService

    Modules\Shared\Infrastructure\Plans\ConfigBackedPlanLimitsService:
        arguments:
            $limits:
                agents: '%env(int:AGENTS_MAX_PER_ORGANIZATION)%'
                projects: '%env(int:PROJECTS_MAX_PER_WORKSPACE)%'
                workspaces: '%env(int:WORKSPACES_MAX_PER_ORGANIZATION)%'
                members: '%env(int:MEMBERS_MAX_PER_ORGANIZATION)%'

    # Organizations module bindings
    Modules\Organizations\Domain\OrganizationRepository:
        alias: Modules\Organizations\Infrastructure\Doctrine\Repository\DoctrineOrganizationRepository

    Modules\Organizations\Api\OrganizationsApi:
        alias: Modules\Organizations\Infrastructure\Api\DefaultOrganizationsApi

    # UserManagement module bindings
    Modules\UserManagement\Domain\UserProfileRepository:
        alias: Modules\UserManagement\Infrastructure\Doctrine\Repository\DoctrineUserProfileRepository

    Modules\UserManagement\Application\ReadModel\UserProfileReadModel:
        alias: Modules\UserManagement\Infrastructure\ReadModel\DbalUserProfileReadModel

    Modules\UserManagement\Api\UserManagementApi:
        alias: Modules\UserManagement\Infrastructure\Api\DefaultUserManagementApi

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        # swap doctrine-backed install adapters with in-memory fakes for endpoint tests
        App\Tests\Fixtures\Core\InMemorySystemSettingRepository: ~
        App\Tests\Fixtures\Core\SpyAuditLogger: ~
        App\Tests\Fixtures\Audit\StubTestUndoer:
            tags: ['audit.undoer']
        App\Tests\Fixtures\Auth\SpyAuthApi: ~
        App\Tests\Fixtures\Auth\InMemoryUserRepository: ~
        App\Tests\Fixtures\Workspaces\InMemoryWorkspaceRepository: ~
        App\Tests\Fixtures\Workspaces\InMemoryWorkspaceMembersReadModel: ~
        App\Tests\Fixtures\Projects\InMemoryProjectRepository: ~
        App\Tests\Fixtures\Agents\InMemoryAgentRepository: ~
        App\Tests\Fixtures\Agents\InMemoryAgentMemberRepository: ~
        App\Tests\Fixtures\Agents\InMemoryAgentTemplateRepository: ~
        App\Tests\Fixtures\Organizations\InMemoryOrganizationRepository: ~
        App\Tests\Fixtures\UserManagement\InMemoryUserProfileRepository: ~
        App\Tests\Fixtures\UserManagement\InMemoryUserProfileReadModel: ~

        Modules\Core\Domain\SystemSettingRepository:
            alias: App\Tests\Fixtures\Core\InMemorySystemSettingRepository

        Modules\Core\Api\AuditLoggerInterface:
            alias: App\Tests\Fixtures\Core\SpyAuditLogger

        Modules\Auth\Api\AuthApi:
            alias: App\Tests\Fixtures\Auth\SpyAuthApi

        Modules\Auth\Domain\UserRepository:
            alias: App\Tests\Fixtures\Auth\InMemoryUserRepository

        Modules\Workspaces\Domain\WorkspaceRepository:
            alias: App\Tests\Fixtures\Workspaces\InMemoryWorkspaceRepository

        Modules\Workspaces\Application\ReadModel\WorkspaceMembersReadModel:
            alias: App\Tests\Fixtures\Workspaces\InMemoryWorkspaceMembersReadModel

        Modules\Projects\Domain\ProjectRepository:
            alias: App\Tests\Fixtures\Projects\InMemoryProjectRepository

        Modules\Agents\Domain\AgentRepository:
            alias: App\Tests\Fixtures\Agents\InMemoryAgentRepository

        Modules\Agents\Domain\AgentMemberRepository:
            alias: App\Tests\Fixtures\Agents\InMemoryAgentMemberRepository

        Modules\Agents\Domain\AgentTemplateRepository:
            alias: App\Tests\Fixtures\Agents\InMemoryAgentTemplateRepository

        Modules\Organizations\Domain\OrganizationRepository:
            alias: App\Tests\Fixtures\Organizations\InMemoryOrganizationRepository

        Modules\UserManagement\Domain\UserProfileRepository:
            alias: App\Tests\Fixtures\UserManagement\InMemoryUserProfileRepository

        Modules\UserManagement\Application\ReadModel\UserProfileReadModel:
            alias: App\Tests\Fixtures\UserManagement\InMemoryUserProfileReadModel

        # swap real health checks with always-healthy fakes so endpoint tests do not require live infrastructure
        Modules\Core\Infrastructure\HealthCheck\DbHealthCheck:
            class: App\Tests\Fixtures\Core\FakeHealthyCheck
            arguments: ['db']

        Modules\Core\Infrastructure\HealthCheck\RedisHealthCheck:
            class: App\Tests\Fixtures\Core\FakeHealthyCheck
            arguments: ['redis']

        Modules\Core\Infrastructure\HealthCheck\RabbitHealthCheck:
            class: App\Tests\Fixtures\Core\FakeHealthyCheck
            arguments: ['rabbitmq']

