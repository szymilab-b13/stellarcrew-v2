# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# Routes are declared via the #[Route] attribute on controller classes.
# See also https://symfony.com/doc/current/routing.html

app_controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

modules_controllers:
    resource:
        path: ../modules/
        namespace: Modules
    type: attribute
