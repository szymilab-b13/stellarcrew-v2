security:
    password_hashers:
        Modules\Auth\Infrastructure\Security\SecurityUser: 'auto'
        Modules\Auth\Infrastructure\Security\HashablePlaintextUser: 'auto'

    providers:
        app_users:
            id: Modules\Auth\Infrastructure\Security\DoctrineAuthUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_users
            jwt: ~
            entry_point: jwt

    access_control:
        - { path: ^/api/install, roles: PUBLIC_ACCESS }
        - { path: ^/api/health, roles: PUBLIC_ACCESS }
        - { path: ^/api/ready, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/logout, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/me, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Modules\Auth\Infrastructure\Security\SecurityUser:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
            Modules\Auth\Infrastructure\Security\HashablePlaintextUser:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
