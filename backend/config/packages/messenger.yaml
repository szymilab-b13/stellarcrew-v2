framework:
    messenger:
        transports:
            sync: 'sync://'

            # Agent reply fan-out to Node workers.
            # Workers bind their own queue to this direct exchange with
            # routing_key = worker_id when they start, so Symfony only
            # publishes here and does not auto-declare queues itself.
            chat_agent_replies:
                dsn: '%env(AGENT_REPLIES_TRANSPORT_DSN)%'
                serializer: Modules\Chat\Infrastructure\Messenger\AgentReplyRequestedSerializer
                options:
                    exchange:
                        name: 'chat.agent_replies'
                        type: direct
                        default_publish_routing_key: ''
                    queues: {}
                    auto_setup: true

        routing:
            'Modules\Chat\Application\AgentReplyRequested': chat_agent_replies

when@test:
    framework:
        messenger:
            transports:
                chat_agent_replies: 'in-memory://'
