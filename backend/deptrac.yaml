deptrac:
    paths:
        - src
        - modules
    exclude_files:
        - '#.*/tests/.*#'
        - '#.*/vendor/.*#'

    layers:
        - name: Domain
          collectors:
              - type: classLike
                value: 'Modules\\[A-Za-z0-9]+\\Domain\\.*'
        - name: Application
          collectors:
              - type: classLike
                value: 'Modules\\[A-Za-z0-9]+\\Application\\.*'
        - name: Infrastructure
          collectors:
              - type: classLike
                value: 'Modules\\[A-Za-z0-9]+\\Infrastructure\\.*'
        - name: Api
          collectors:
              - type: classLike
                value: 'Modules\\[A-Za-z0-9]+\\Api\\.*'
        - name: SharedKernel
          collectors:
              - type: classLike
                value: 'Modules\\Shared\\Kernel\\.*'
        - name: Vendor
          collectors:
              - type: classLike
                value: 'Symfony\\.*'
              - type: classLike
                value: 'Doctrine\\.*'
              - type: classLike
                value: 'Psr\\.*'
              - type: classLike
                value: 'OpenApi\\.*'

    ruleset:
        # Domain is pure: no outward dependencies on other layers
        Domain:
            - SharedKernel
            - Vendor
        # Application orchestrates Domain + SharedKernel
        Application:
            - Domain
            - SharedKernel
            - Vendor
        # Infrastructure wires Application + Domain + SharedKernel and implements Api contracts
        Infrastructure:
            - Application
            - Domain
            - Api
            - SharedKernel
            - Vendor
        # Api exposes DTO + adapter over Application
        Api:
            - Application
            - SharedKernel
            - Vendor
        SharedKernel:
            - Vendor
        Vendor: ~

    skip_violations: []
